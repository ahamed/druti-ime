name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: examples/playground/yarn.lock
      - run: cargo clippy -p druti-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Build the playground (wasm-pack, type check, Vite)
        working-directory: examples/playground
        run: |
          yarn install --frozen-lockfile
          yarn build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: Docs build without warnings (broken links, missing docs)
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # The workspace's rust-version (Cargo.toml) must stay true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features

  macos:
    # Apple Silicon only: the macOS input source and the iOS keyboard, both arm64
    # (apple-silicon-and-ios-keyboard design D1).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - name: Swift format and style
        # The newest Xcode on the image; its swift-format is closest to current local Xcodes.
        run: |
          make -C macos lint
          make -C ios lint
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      - name: Swift tests on macOS (bindings and helpers)
        run: make -C macos test
      - name: Swift tests on the iOS Simulator
        run: make -C ios test
      - name: Build and sign the input method
        run: make -C macos app
      - name: Build the iOS app and keyboard
        run: make -C ios app
      - name: Check the bundles
        run: |
          FRAMEWORK=macos/BengaliIMECore/BengaliIMEFFI.xcframework
          MAC_APP=macos/build/DerivedData/Build/Products/Release/Druti.app
          IOS_APP=ios/build/DerivedData/Build/Products/Release-iphoneos/Druti.app
          KEYBOARD="$IOS_APP/PlugIns/DrutiKeyboard.appex"
          for BIN in "$FRAMEWORK"/{macos-arm64,ios-arm64,ios-arm64-simulator}/libbengali_ime_ffi.a \
              "$MAC_APP/Contents/MacOS/Druti" "$IOS_APP/Druti" "$KEYBOARD/DrutiKeyboard"; do
            ARCHS="$(lipo -archs "$BIN")"
            echo "$BIN: $ARCHS"
            [ "$ARCHS" = arm64 ] || { echo "::error::$BIN should be arm64 only, has $ARCHS"; exit 1; }
          done
          plutil -extract InputMethodServerControllerClass raw "$MAC_APP/Contents/Info.plist"
          plutil -extract CFBundleIdentifier raw "$MAC_APP/Contents/Info.plist"
          test -f "$MAC_APP/Contents/Resources/MenuIcon.tiff"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$KEYBOARD/Info.plist"
          plutil -extract NSExtension.NSExtensionPrincipalClass raw "$KEYBOARD/Info.plist"
          [ "$(plutil -extract NSExtension.NSExtensionAttributes.RequestsOpenAccess raw "$KEYBOARD/Info.plist")" = false ]
