# Builds Druti's DMG and zipped app for a macos-vX.Y.Z tag and attaches them to a
# draft GitHub Release (add-macos-distribution design D10, druti-wasm-playground
# D9). The maintainer tests the downloads and publishes the draft by hand. No
# secrets: the app is signed ad hoc.
name: Release macOS

on:
  push:
    tags: ['macos-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          VERSION="$(make -s -C macos version)"
          if [ "$GITHUB_REF_NAME" != "macos-v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $VERSION in macos/project.yml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          brew install xcodegen
          pip install -r macos/Packaging/requirements.txt
      - name: Tests
        run: |
          cargo test -p druti-core
          make -C macos test

      - name: Build the DMG and the zipped app
        run: make -C macos dmg app-zip CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Checksums
        working-directory: macos/build
        run: |
          shasum -a 256 "Druti-$VERSION.dmg" | tee "Druti-$VERSION.dmg.sha256"
          shasum -a 256 "Druti-$VERSION.app.zip" | tee "Druti-$VERSION.app.zip.sha256"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/@VERSION@/$VERSION/g" macos/Packaging/release-notes.md > "$RUNNER_TEMP/notes.md"
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --draft $PRERELEASE --verify-tag \
            --title "Druti $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "macos/build/Druti-$VERSION.dmg" "macos/build/Druti-$VERSION.dmg.sha256" \
            "macos/build/Druti-$VERSION.app.zip" "macos/build/Druti-$VERSION.app.zip.sha256"
