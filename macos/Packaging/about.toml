# cargo-about: the license notices for the Rust crates compiled into Druti
# (add-macos-distribution design D9). `make licenses` runs it. A crate whose
# license isn't accepted here fails the build, and with it the release.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # druti-core's Autocorrect word list (autocorrect design D7); the code is MIT.
    "CC-BY-SA-4.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
