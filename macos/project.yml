# XcodeGen spec: `xcodegen generate` writes Druti.xcodeproj (not
# committed). Use the Makefile rather than building in Xcode directly.
name: Druti
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    # Universal: Apple Silicon and Intel.
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # The app's version, and its only source: `make version` prints it and the
    # release workflow checks the macos-vX.Y.Z tag against it. CI overrides the
    # build number with the workflow run number.
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 1
packages:
  BengaliIMECore:
    path: BengaliIMECore
targets:
  Druti:
    type: application
    platform: macOS
    sources:
      - path: Druti
    dependencies:
      - package: BengaliIMECore
      - sdk: InputMethodKit.framework
      - sdk: Carbon.framework
    settings:
      base:
        PRODUCT_NAME: Druti
        PRODUCT_BUNDLE_IDENTIFIER: com.ahamed.inputmethod.Druti
        INFOPLIST_FILE: Druti/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Signed ad hoc by the Makefile after the build (no Apple account needed).
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  Druti:
    build:
      targets:
        Druti: all
