schema: spec-driven

context: |
  Project: Druti (github.com/ahamed/druti-ime), a deterministic phonetic roman-to-Bengali
  transliteration engine (Avro-style typing, not translation). Rust is the only implementation.
  - crates/druti-core: Engine (state: output, buffer, flags; process()/process_backspace() return
    Actions: Insert, Replace(back), Delete(back), SplitBlock; rules in src/rules.rs), Composer
    (commit/pending split for marked-text hosts), Config toggles, transpile. Behaviour is pinned by
    golden JSON fixtures in crates/druti-core/tests/fixtures/ (engine/ first generated by the
    since-removed TypeScript engine, composer/ hand-written); intended changes edit the fixtures in
    the same commit.
  - crates/druti-ffi: UniFFI bindings (library name bengali_ime_ffi) packaged as an XCFramework
    (arm64 slices for macOS, iOS devices and the iOS Simulator).
  - crates/druti-wasm: wasm-bindgen bindings for the web playground in examples/playground/
    (Vite + TypeScript UI glue), deployed to GitHub Pages.
  - macOS: Druti, a Swift + AppKit + InputMethodKit input source, Xcode project generated by
    XcodeGen, ad-hoc signed, distributed publicly as a DMG (and zipped .app) on GitHub Releases.
    The app installs itself into ~/Library/Input Methods when opened from the DMG; make install
    runs the same installer for developers.
  - iOS: Druti, a keyboard extension (UIKit) in a SwiftUI app, in ios/, built from source with
    XcodeGen and installed from Xcode with the developer's own Apple account. Its session logic
    (KeyboardSession, KeyboardState) lives in the shared macos/BengaliIMECore Swift package.
  - Typing model: Bengali appears on every key; everything except the engine buffer is committed,
    the buffer is marked text with the underline hidden where possible.
  - Target: Apple silicon only (arm64; no Intel, Rosetta or x86_64 simulator), macOS 14 and iOS 17.
    No paid Apple Developer account: no Developer ID, no notarization, no App Store, no CI secrets.

  Constraints:
  - Do not change the engine's observable behaviour unless a change says so explicitly; new
    options must default to the current behaviour.
  - Lengths crossing the FFI and WASM boundaries are UTF-16 code units (NSRange, JavaScript strings).
  - Development happens partly on Linux (Rust, WASM, playground) and partly on the user's Mac
    (Xcode, InputMethodKit, iOS devices, manual app testing); tasks should say which.

rules:
  tasks:
    - Group tasks by milestone and mark each group as "Linux" or "Mac" depending on where it can be built and verified
    - Every task that changes engine behaviour must name the fixture or test that proves it
  design:
    - Call out any intended change to engine or composer behaviour and the fixtures it edits
